name: API Deployment Smoke Test
description: Extracts access info from deploy.out and fires off a sample GraphQL query

inputs:

  query:
    description: The GraphQL query to send
    required: true
    type: string
    default: "query {about}"
  expected-regex:
    description: A regex for verifying the response from the deployed API
    required: true
    default: "data.*about.*Hello"
  working-directory:
    description: The working-directory
    required: true
    default: .
  url:
    description: Overwrites URL in case the API cannot be reached through the internal URL (this is the case for our apigw APIs)
    required: false
  legacy-api-key:
    description: |
      Fallback API key value to use as `x-api-key` when serverless deploy output
      doesn't include a `TempApiKey-…` line (e.g. when the stack has moved past
      the legacy `apiGateway.apiKeys` config to a Lambda authorizer). Should be
      passed as a secret. Auto-masked via `::add-mask::` regardless.
    required: false
    default: ""

runs:
  using: node20
  main: dist/index.js
